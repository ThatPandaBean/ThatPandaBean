<svg xmlns="http://www.w3.org/2000/svg" width="270" height="130" viewBox="0 0 270 130" role="img" aria-label="workout: Push/pull/legs, daily abs and Couch to 5K home-screen app"><title>workout: Push/pull/legs, daily abs and Couch to 5K home-screen app</title><style>@font-face{font-family:f-head;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:f-body;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:f-mono;src:url(data:font/woff;base64,) format('woff')}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
